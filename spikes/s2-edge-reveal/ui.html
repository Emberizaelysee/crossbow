<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>S2 UI</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font: 13px system-ui, sans-serif; color: #eee; overflow: hidden; }
  #frame { position: fixed; inset: 0; border: 2px solid #4f8cff; box-sizing: border-box; }
  #panel { position: fixed; inset: 0; display: none; background: rgba(28, 30, 36, 0.96); padding: 12px; box-sizing: border-box; }
  body.open #frame { display: none; }
  body.open #panel { display: block; }
  #log { position: fixed; bottom: 8px; left: 12px; font: 11px monospace; color: #9ab; }
</style>
<div id="frame"></div>
<div id="panel"><b id="title"></b><p>Prototype panel. Move the mouse out to hide it.</p><div id="log"></div></div>
<script src="ui.js"></script>
